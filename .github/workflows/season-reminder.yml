name: season-reminder

on:
  schedule:
    # April 20, 08:00 UTC = 10:00 CEST. A couple weeks ahead of a typical
    # early-May season start, leaving room to set the dates before forecasts
    # need to start going out.
    - cron: "0 8 20 4 *"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send season setup reminder
        run: python src/season_reminder.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
