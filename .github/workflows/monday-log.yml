name: monday-logging

on:
  schedule:
    # 06:04 UTC = 08:04 Prague during summer time (CEST, UTC+2). Off-the-hour
    # on purpose: GitHub delays scheduled runs most right at the top of the
    # hour (its own docs name this as the highest-load slot).
    # Season runs first-weekend-of-May to first-weekend-of-October, which by
    # construction never crosses a DST boundary, so DST always applies here.
    - cron: "4 6 * * MON"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

jobs:
  log-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send logging message
        run: python src/log_message.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ_NAME: "Europe/Prague"
