name: weekend-forecast

on:
  schedule:
    # 15:04 UTC = 17:04 Prague during summer time (CEST, UTC+2). Off-the-hour
    # on purpose: GitHub delays scheduled runs most right at the top of the
    # hour (its own docs name this as the highest-load slot).
    # Season runs first-weekend-of-May to first-weekend-of-October, which by
    # construction never crosses a DST boundary, so DST always applies here.
    #
    # Two separate entries (not one "THU,FRI" cron) on purpose: GitHub sets
    # github.event.schedule to the literal cron string that matched, so
    # splitting them is what lets src/forecast.py (via SCHEDULE_CRON below)
    # tell a Thursday run from a Friday run even if GitHub delays one badly
    # enough that it executes on the wrong calendar day.
    - cron: "4 15 * * THU"
    - cron: "4 15 * * FRI"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send forecast DM
        run: python src/forecast.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LAT: "49.97233"
          LON: "18.14489"
          TZ_NAME: "Europe/Prague"
          WORK_START: "9"
          WORK_END: "20"
          SCHEDULE_CRON: ${{ github.event.schedule }}
