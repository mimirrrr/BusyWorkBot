name: completeness-sweep

on:
  schedule:
    # 19:04 UTC Tuesday = 21:04 (9pm) Prague (CEST) — right after Monday's
    # 08:00 logging message has had its shot at filling in Sat/Sun, so a
    # missed fill gets caught the very next evening. Off-the-hour on purpose:
    # GitHub delays scheduled runs most right at the top of the hour.
    - cron: "4 19 * * TUE"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send completeness nag
        run: python src/completeness_sweep.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ_NAME: "Europe/Prague"
